<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saisie des scores - DTEA EVENT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="carte-score">
  <div class="contenu-carte">

    <div id="badge-box" class="badge-eyebrow" style="display: none;"></div>
    <h1>Saisie des distances</h1>
    <p class="sous-titre">5 coups - Moyenne des 4 meilleurs, l'erreur est permise !</p>

    <p id="message-scores-verrouilles" class="alerte-verrouillage" style="display: none;">Les scores sont verrouillés, la saisie est terminée.</p>

    <label for="box-select" id="label-box-select" style="display: none;">Numéro de box</label>
    <select id="box-select" style="display: none;">
      <option value="">-- Sélectionne ta box --</option>
    </select>

    <div id="section-scores" style="display: none;">
      <div id="joueurs-scores-container"></div>
      <button id="btn-verrouiller-local" type="button" class="btn-cta">Verrouiller les scores</button>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/scores.js"></script>
</body>
</html>
