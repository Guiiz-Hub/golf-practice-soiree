<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice Golf - Soirée DTEA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="carte-score">
  <h1>Bienvenue au DTEA EVENT 2026 !!</h1>
  <p>Choisis le numéro de ta box pour commencer.</p>

  <label for="box-select">Numéro de box</label>
  <select id="box-select">
    <option value="">-- Sélectionne ta box --</option>
  </select>
  <div id="section-joueurs" style="display: none;">
    <hr>
    
    <div id="bloc-ajout-joueur">
      <p>Joueurs déjà inscrits :</p>
      <ul id="liste-joueurs"></ul>

      <p>Ajoute-toi :</p>
      <input type="text" id="input-prenom" placeholder="Prénom">
      <input type="text" id="input-nom" placeholder="Nom">
      <input type="text" id="input-pseudo" placeholder="Pseudo (optionnel)">
      <select id="input-service">
        <option value="">-- Service --</option>
      </select>
      <button id="btn-ajouter-joueur" type="button">+ Ajouter ce joueur</button>

      <button id="btn-bonne-chance" type="button" disabled>Let's Go !</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/inscription.js"></script>
</body>
</html>
